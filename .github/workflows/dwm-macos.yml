name: dwm native macOS
on:
  push:
    paths: ['dwm/**', 'macos/dwm/**', '.github/workflows/dwm-macos.yml']
  pull_request:
    paths: ['dwm/**', 'macos/dwm/**', '.github/workflows/dwm-macos.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    env:
      CFLAGS: -O2 -Wall -Wextra -Werror
    steps:
      - uses: actions/checkout@v4
      - name: Portable model tests
        run: make -C dwm test-native CFLAGS="$CFLAGS"
      - name: Native build
        run: make -C dwm CFLAGS="$CFLAGS"
      - name: Compile Intel backend
        run: make -C macos/dwm clean all CC='clang -arch x86_64' CFLAGS="$CFLAGS"
      - name: Stage installation
        run: make -C dwm install DESTDIR="$RUNNER_TEMP/dwm-stage" PREFIX=/usr/local
